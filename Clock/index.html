<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
      div {
        background-color: rgb(178, 238, 253);
      }
      div > div {
        background: #fff;
      }
    </style>
  </head>
<body>
    <div class="w-full h-screen grid place-items-center">
        <div class="border p-10 rounded-xl shadow-lg bg-white">
            <div class="text-4xl text-center mb-4" id="time">09:15</div>
            <div class="text-center my-3 italic font-bold" id="date">
                Oct / 03 / 2026
            </div>
            <ul class="grid grid-cols-7 gap-4 *:px-2 *:py-1 *:text-center *:rounded *:shadow-gray-400 *:shadow-md *:cursor-pointer"
                id="day">
                <li>Sun</li>
                <li>Mon</li>
                <li>Tue</li>
                <li>Wed</li>
                <li>Thu</li>
                <li>Fri</li>
                <li>Sat</li>
            </ul>
        </div>
    </div>

    <script src="./app.js"></script>
</body>
</html>
